<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Dashboard - South Coast Pizza</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
 <header class="topbar">
  <div class="logo">SOUTH COAST <span>PIZZA</span></div>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <button id="logout-btn" class="logout-btn">Logout</button>
  </nav>
</header>


  <main class="main-area">
    <h2>Current Orders (Employee View)</h2>
    <div id="orders-list"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 South Coast Pizza | Employee Area</p>
  </footer>

  <script>
    if (localStorage.getItem('role') !== 'employee') {
      window.location.href = 'admin.html';
    }

    const orders = JSON.parse(localStorage.getItem('allOrders')) || {};
    const container = document.getElementById('orders-list');

    if (Object.keys(orders).length === 0) {
      container.innerHTML = "<p>No current orders.</p>";
    } else {
      for (const [table, items] of Object.entries(orders)) {
        const list = items.map(item => `<li>${item.name} × ${item.qty} — £${(item.price * item.qty).toFixed(2)}</li>`).join('');
        container.innerHTML += `
          <section>
            <h3>Table ${table}</h3>
            <ul>${list}</ul>
          </section>
        `;
      }
    }
    // 🔹 Logout button click handler
    document.getElementById('logout-btn').addEventListener('click', function() {
      localStorage.removeItem('role'); // Clear the role
      window.location.href = 'admin.html'; // Redirect to login page
    });
  </script>
</body>
</html>
