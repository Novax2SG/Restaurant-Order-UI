<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - South Coast Pizza</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="topbar">
  <div class="logo">SOUTH COAST <span>PIZZA</span></div>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <button id="logout-btn" class="logout-btn">Logout</button>
  </nav>
</header>


  <main class="main-area">
    <h2>Current Orders by Table</h2>
    <div id="orders-list"><!-- JS will load orders here --></div>
    <!-- 🔹 Moved Order History outside orders-list for clarity -->
    <h2>Order History</h2>
    <div id="order-history"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 South Coast Pizza | Admin Area</p>
  </footer>

  <script>
  // 🔹 Ensure only admins can access
  if (localStorage.getItem('role') !== 'admin') {
    window.location.href = 'admin.html';
  }

  // 🔹 Get DOM elements and data
  const ordersList = document.getElementById('orders-list');
  const orderHistory = JSON.parse(localStorage.getItem('orderHistory')) || [];
  const orders = JSON.parse(localStorage.getItem('allOrders')) || {};

  // 🔹 Render current orders
  function renderOrders() {
    ordersList.innerHTML = '';
    if (Object.keys(orders).length === 0) {
      ordersList.innerHTML = "<p>No current orders.</p>";
      return;
    }
    for (const [table, items] of Object.entries(orders)) {
      const list = items.map(item => `<li>${item.name} × ${item.qty} — £${(item.price * item.qty).toFixed(2)}</li>`).join('');
      ordersList.innerHTML += `
        <section>
          <h3>Table ${table}</h3>
          <ul>${list}</ul>
          <button onclick="markComplete('${table}')">Mark Complete</button>
          <button onclick="cancelOrder('${table}')">Cancel Order</button>
        </section>
      `;
    }
  }

  // 🔹 Render order history
  function renderHistory() {
    const historyDiv = document.getElementById('order-history');
    historyDiv.innerHTML = '';
    if (orderHistory.length === 0) {
      historyDiv.innerHTML = "<p>No order history.</p>";
      return;
    }
    orderHistory.forEach(entry => {
      const list = entry.items.map(item => `<li>${item.name} × ${item.qty} — £${(item.price * item.qty).toFixed(2)}</li>`).join('');
      historyDiv.innerHTML += `
        <section>
          <h3>Table ${entry.table} - ${entry.status} (${entry.date})</h3>
          <ul>${list}</ul>
        </section>
      `;
    });
  }

  // 🔹 Mark order as complete
  window.markComplete = function(table) {
    orderHistory.push({ table, items: orders[table], status: "Completed", date: new Date().toLocaleString() });
    localStorage.setItem('orderHistory', JSON.stringify(orderHistory));
    delete orders[table];
    localStorage.setItem('allOrders', JSON.stringify(orders));
    renderOrders();
    renderHistory();
  };

  // 🔹 Cancel order
  window.cancelOrder = function(table) {
    orderHistory.push({ table, items: orders[table], status: "Cancelled", date: new Date().toLocaleString() });
    localStorage.setItem('orderHistory', JSON.stringify(orderHistory));
    delete orders[table];
    localStorage.setItem('allOrders', JSON.stringify(orders));
    renderOrders();
    renderHistory();
  };

  // 🔹 Logout button click handler
  document.getElementById('logout-btn').addEventListener('click', function() {
    localStorage.removeItem('role');
    window.location.href = 'admin.html';
  });

  // 🔹 Initial render
  renderOrders();
  renderHistory();
  </script>
</body>
</html>
